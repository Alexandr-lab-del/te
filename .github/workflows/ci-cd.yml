name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/work_1

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - "5432:5432"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: Clear cache
        run: |
          pip cache purge

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up environment variables
        run: |
          echo "POSTGRES_DB=test_db" >> $GITHUB_ENV
          echo "POSTGRES_USER=test_user" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=test_password" >> $GITHUB_ENV
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV

      - name: Set up .pgpass for PostgreSQL
        run: |
          echo "localhost:5432:test_db:${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}" > ~/.pgpass
          chmod 600 ~/.pgpass

      - name: Drop Test Database
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
        run: |
          psql -U ${{ env.POSTGRES_USER }} -h ${{ env.POSTGRES_HOST }} -d postgres -c "DROP DATABASE IF EXISTS test_db;"

      - name: Wait for PostgreSQL to be ready
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
            for i in {1..10}; do
              if PGPASSWORD=$PGPASSWORD psql -U ${{ env.POSTGRES_USER }} -h ${{ env.POSTGRES_HOST }} -d postgres -c '\q'; then
                echo "PostgreSQL is ready!"
                exit 0
              fi
              echo "Waiting for PostgreSQL..."
              sleep 5
            done
            echo "PostgreSQL did not become ready in time."
            exit 1

      - name: Run tests
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
        run: |
          python manage.py migrate --noinput
          python manage.py test --keepdb --noinput

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy using SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_KEY }}

      - name: Deploy to server
        run: |
          ssh -v -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd te
            git pull origin main
            docker-compose down
            docker-compose up -d --build
          EOF
